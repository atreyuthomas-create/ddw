  const now = new Date();

  notifications.forEach(n => {

function navigate(section) {
  currentSection = section;
  currentSalesModule = null;
  currentLesson = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + section).classList.add('active');
  render();
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

      <button class="back-btn" onclick="backToModules()">← BACK TO MODULES</button>
      <div class="tag" style="background:${mod.color}">${mod.tag}</div>
      <div style="font-size:20px;font-weight:bold;margin-bottom:4px">Module ${mod.id}: ${mod.title}</div>
      <div style="font-size:11px;color:${mod.color};font-family:monospace">💰 ${mod.income} · ⏱ ${mod.duration}</div>
    </div>
    <div style="padding:16px 18px">
      <div style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:14px;margin-bottom:14px;font-size:12px;color:#aaa;line-height:1.7">${mod.summary}</div>
      <div style="font-size:10px;letter-spacing:3px;color:#444;font-family:monospace;margin-bottom:10px">LESSONS — TAP TO EXPAND</div>
      ${mod.lessons.map((lesson, i) => `
        <div onclick="openLesson(${i})" style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:13px;font-weight:bold">${lesson.title}</div>
          <div style="color:${mod.color};font-size:20px">›</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderLesson(c) {
  const mod = currentSalesModule;
  const lesson = currentLesson;
  c.innerHTML = `
    <div style="background:#0a0a0a;padding:20px 20px 16px;border-bottom:2px solid ${mod.color}">
      <button class="back-btn" onclick="backToModule()">← BACK TO MODULE</button>
      <div style="font-size:18px;font-weight:bold">${lesson.title}</div>
    </div>
    <div style="padding:20px 18px">
      <div style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:18px;font-size:13px;color:#ccc;line-height:1.85">${lesson.detail}</div>
      <div style="margin-top:16px;background:#0a0a0a;border:1px solid #1a1a1a;padding:14px;font-family:monospace;font-size:11px;color:#666;line-height:1.7">
        🎙️ <strong style="color:#888">CAR DRILL:</strong> Say this out loud 3 times on your next drive. The reps that own the lines own the doors.
      </div>
    </div>
  `;
}

function openModule(id) {
  currentSalesModule = salesModules.find(m => m.id === id);
  renderSales(document.getElementById('content'));
  document.getElementById('content').scrollTop = 0;
}

function openLesson(i) {
  currentLesson = currentSalesModule.lessons[i];
  renderSales(document.getElementById('content'));
  document.getElementById('content').scrollTop = 0;
}

function backToModules() {
  currentSalesModule = null;
  currentLesson = null;
  renderSales(document.getElementById('content'));
}

function backToModule() {
  currentLesson = null;
  renderSales(document.getElementById('content'));
}

// ── INIT ──────────────────────────────────────────────────────
render();
</script>
</body>
</html>
