    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* Install banner */
    #install-banner {

      font-family: monospace; font-size: 12px; font-weight: bold;
    }
    #install-banner.show { display: flex; }

    /* Notification banner */
    #notif-banner {
      display: none;
      position: fixed; bottom: 80px; left: 16px; right: 16px; z-index: 9998;
      background: #111; border: 1px solid #C0C0C0; border-left: 3px solid #00E5A0;
      padding: 12px 14px; font-family: monospace; font-size: 11px; color: #ccc;
      animation: slideUp 0.3s ease;
    }
    #notif-banner.show { display: block; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Scrollable content */
    #content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }

    /* Bottom nav */
    #bottom-nav {
      flex-shrink: 0;
      display: flex;
      background: #0a0a0a;
      border-top: 1px solid #1e1e1e;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1; border: none; background: transparent; color: #3a3a3a;
      padding: 10px 4px 8px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      border-top: 2px solid transparent; transition: all 0.2s;
      font-family: monospace;
    }
    .nav-btn.active { color: #C0C0C0; border-top-color: #C0C0C0; }
    .nav-btn span.icon { font-size: 18px; }
    .nav-btn span.label { font-size: 8px; letter-spacing: 1px; }

    /* Cards */
    .card { background: #0f0f0f; border: 1px solid #1e1e1e; }
    .card-accent { border-left: 3px solid #C0C0C0; }
    .section-header { background: #0a0a0a; padding: 22px 20px 14px; border-bottom: 2px solid #C0C0C0; }
    .tag { display: inline-block; color: #000; font-size: 9px; font-weight: bold; letter-spacing: 3px; padding: 2px 8px; font-family: monospace; margin-bottom: 6px; }
    .mono { font-family: monospace; }
    .dim { color: #444; }
    .small { font-size: 10px; }
    .pad { padding: 16px 18px; }

    /* Day tabs */
    .day-tabs { display: flex; overflow-x: auto; background: #0a0a0a; border-bottom: 1px solid #1e1e1e; padding: 0 14px; scrollbar-width: none; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab { flex: 0 0 auto; padding: 12px 13px; border: none; background: transparent; border-bottom: 3px solid transparent; color: #444; cursor: pointer; font-family: monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; transition: all 0.2s; white-space: nowrap; }
    .day-tab.active { border-bottom-color: var(--day-color); color: var(--day-color); }

    /* Meal tabs */
    .meal-tabs { display: flex; background: #0a0a0a; border-bottom: 1px solid #1e1e1e; padding: 0 14px; }
    .meal-tab { flex: 1; padding: 11px 4px; border: none; background: transparent; border-bottom: 3px solid transparent; color: #444; cursor: pointer; font-family: monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
    .meal-tab.active { color: #e8e8e8; border-bottom-color: #FFB547; }

    /* Exercise rows */
    .ex-row { background: #141414; border: 1px solid #1e1e1e; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px; margin-bottom: 7px; }

    /* Timeline */
    .timeline { position: relative; padding-left: 20px; }
    .timeline-line { position: absolute; left: 8px; top: 16px; bottom: 16px; width: 1px; background: #1a1a1a; }
    .timeline-item { display: flex; gap: 12px; margin-bottom: 11px; align-items: flex-start; }
    .timeline-dot { width: 32px; height: 32px; border-radius: 50%; background: #111; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; z-index: 1; }

    /* Sales modules */
    .module-card { background: #0f0f0f; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; }
    .lesson-card { background: #0f0f0f; border: 1px solid #1e1e1e; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

    .back-btn { background: none; border: none; color: #444; font-family: monospace; font-size: 11px; cursor: pointer; padding: 0 0 10px 0; display: block; }

    /* Grocery checklist */
    .grocery-item { background: #141414; border: 1px solid #1c1c1c; padding: 5px 10px; font-size: 10px; color: #888; font-family: monospace; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .grocery-item.checked { color: #444; text-decoration: line-through; }
    .grocery-item.checked::before { content: "✓"; color: #00E5A0; }
    .grocery-item:not(.checked)::before { content: "☐"; }

function checkNotifications() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  notifications.forEach(n => {
    if (n.hour === h && m >= n.min && m < n.min + 2) {
      showNotif(n.msg);
    }
  });
}

function showNotif(msg) {
  const banner = document.getElementById('notif-banner');
  document.getElementById('notif-text').textContent = msg;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 8000);
}

function dismissNotif() {
  document.getElementById('notif-banner').classList.remove('show');
}

function navigate(section) {
  currentSection = section;
  currentSalesModule = null;
  currentLesson = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + section).classList.add('active');
  render();
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

        ].map(t => `<div style="font-size:11px;color:#777;font-family:monospace;padding:5px 0;border-bottom:1px solid #141414">☐ ${t}</div>`).join('')}
    </div>` : '';

  const grocHtml = groceryList.map((g, gi) => {
    const itemsHtml = g.items.map((item, ii) => {
      const key = `g_${gi}_${ii}`;
      const checked = checkedGroceries[key] ? 'checked' : '';
      return `<div class="grocery-item ${checked}" onclick="toggleGrocery('${key}', this)">${item}</div>`;
    }).join('');
    return `
      <div style="background:#0f0f0f;border:1px solid #1e1e1e;padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:11px;font-weight:bold;font-family:monospace">${g.cat}</div>
          <div style="font-size:11px;color:#00E5A0;font-family:monospace">${g.perPerson}/person</div>
        </div>
        ${itemsHtml}
      </div>`;
  }).join('');

  c.innerHTML = `
    <div style="background:#0a0a0a;padding:22px 20px 14px;border-bottom:2px solid #FFB547">
      <div style="font-size:10px;letter-spacing:4px;color:#444;font-family:monospace;margin-bottom:4px">COSTCO BULK · 4 GUYS SPLIT · ~$90/PERSON/WEEK</div>
      <div style="font-size:22px;font-weight:bold">Meal Plan</div>
      <div style="font-size:11px;color:#555;font-family:monospace">High protein · No cooking skill needed</div>
    </div>
    <div class="meal-tabs">${tabsHtml}</div>
    <div style="padding:16px 18px">
      <div style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid #FFB547">
        <div style="padding:14px 16px 10px;border-bottom:1px solid #1e1e1e;display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:15px;font-weight:bold;margin-bottom:3px">${m.icon} ${m.name}</div>
            <div style="font-size:10px;color:#444;font-family:monospace">${m.time}</div>
            <div style="font-size:10px;color:#00E5A0;font-family:monospace;margin-top:3px">Cost per serving: ${m.cost}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:bold;color:#FFB547;font-family:monospace">${m.macros.calories}</div>
            <div style="font-size:9px;color:#444;font-family:monospace">KCAL</div>
          </div>
        </div>
        <div style="padding:12px 16px">
          ${m.items.map((item, j) => `
            <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:${j<m.items.length-1?'1px solid #141414':'none'}">
              <span style="font-size:12px;color:#ccc">${item.food}</span>
              <span style="font-size:11px;color:#666;font-family:monospace">${item.amount}</span>
            </div>
          `).join('')}
          <div style="display:flex;gap:16px;margin-top:10px;padding-top:8px;border-top:1px solid #1e1e1e">
            <div style="font-family:monospace;font-size:11px"><span style="color:#444">P </span><span style="color:#00E5A0">${m.macros.protein}g</span></div>
            <div style="font-family:monospace;font-size:11px"><span style="color:#444">C </span><span style="color:#FFB547">${m.macros.carbs}g</span></div>
            <div style="font-family:monospace;font-size:11px"><span style="color:#444">F </span><span style="color:#FF6B8A">${m.macros.fat}g</span></div>
          </div>
          <div style="margin-top:10px;background:#0a0a0a;padding:10px;font-size:11px;color:#666;font-family:monospace;line-height:1.6">📦 ${m.prep}</div>
        </div>
      </div>
      ${prepChecklist}
      <div style="margin-top:12px;background:#0a0a0a;border:1px solid #1a1a1a;border-left:3px solid #00E5A0;padding:12px 14px;font-family:monospace;font-size:11px;color:#666;line-height:1.7">
        💡 <span style="color:#888">4 guys = 4× buying power.</span> One person pays at Costco, others Venmo. Rotate weekly. Total per person: <span style="color:#00E5A0">~$85–95/week</span>.
      </div>
      <div style="margin-top:12px">
        <div style="font-size:10px;letter-spacing:3px;color:#444;font-family:monospace;margin-bottom:10px">COSTCO SHOPPING LIST — TAP TO CHECK OFF</div>
        ${grocHtml}
        <button onclick="clearGroceries()" style="width:100%;background:transparent;border:1px solid #1e1e1e;color:#444;font-family:monospace;font-size:10px;padding:10px;cursor:pointer;margin-top:4px">CLEAR ALL CHECKS</button>
      </div>
    </div>
  `;
}

function setMealTab(tab) { currentMealTab = tab; renderMeals(document.getElementById('content')); }

function toggleGrocery(key, el) {
  checkedGroceries[key] = !checkedGroceries[key];
  localStorage.setItem('ddw_groceries', JSON.stringify(checkedGroceries));
  el.classList.toggle('checked');
}

function clearGroceries() {
  checkedGroceries = {};
  localStorage.setItem('ddw_groceries', JSON.stringify(checkedGroceries));
  renderMeals(document.getElementById('content'));
}

// ── SALES ─────────────────────────────────────────────────────
function renderSales(c) {
  if (currentLesson) { renderLesson(c); return; }
  if (currentSalesModule) { renderModule(c); return; }

  c.innerHTML = `
    <div style="background:#0a0a0a;padding:22px 20px 14px;border-bottom:2px solid #FF6B8A">
      <div style="font-size:10px;letter-spacing:4px;color:#444;font-family:monospace;margin-bottom:4px">STUDY IN THE CAR · EARN ON THE DOOR</div>
      <div style="font-size:22px;font-weight:bold">Sales Training</div>
      <div style="font-size:11px;color:#555;font-family:monospace">5 modules · California solar market</div>
    </div>
    <div style="padding:14px 18px 8px">
      <div style="font-size:10px;letter-spacing:3px;color:#444;font-family:monospace;margin-bottom:10px">CAR TRAINING WINDOWS</div>
      ${[
        {time:"Drive to office (30 min)",focus:"Module 1 or 2 review",tip:"Say the lines out loud. Repetition in the car = muscle memory on the door."},
        {time:"Drive to territory (30 min)",focus:"Objection handling (Module 4)",tip:"Pick 2 objections and rehearse until they're automatic."},
        {time:"Drive home after gym",focus:"Mindset debrief (Module 5)",tip:"What went well? What's one thing to improve tomorrow? Say it out loud."},
      ].map(car => `
        <div style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid #FF6B8A;padding:10px 14px;margin-bottom:8px">
          <div style="font-size:12px;font-weight:bold;margin-bottom:3px">${car.time}</div>
          <div style="font-size:11px;color:#00E5A0;font-family:monospace;margin-bottom:3px">${car.focus}</div>
          <div style="font-size:11px;color:#666">${car.tip}</div>
        </div>
      `).join('')}
    </div>
    <div style="padding:0 18px 24px">
      <div style="font-size:10px;letter-spacing:3px;color:#444;font-family:monospace;margin-bottom:10px">TRAINING MODULES</div>
      ${salesModules.map(mod => `
        <div onclick="openModule(${mod.id})" style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:14px 16px;margin-bottom:10px;cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div>
              <div class="tag" style="background:${mod.color}">${mod.tag}</div>
              <div style="font-size:14px;font-weight:bold">Module ${mod.id}: ${mod.title}</div>
            </div>
            <div style="color:${mod.color};font-size:20px">›</div>
          </div>
          <div style="display:flex;gap:12px">
            <div style="font-size:10px;color:#666;font-family:monospace">⏱ ${mod.duration}</div>
            <div style="font-size:10px;color:${mod.color};font-family:monospace">💰 ${mod.income}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderModule(c) {
  const mod = currentSalesModule;
  c.innerHTML = `
    <div style="background:#0a0a0a;padding:20px 20px 16px;border-bottom:2px solid ${mod.color}">
      <button class="back-btn" onclick="backToModules()">← BACK TO MODULES</button>
      <div class="tag" style="background:${mod.color}">${mod.tag}</div>
      <div style="font-size:20px;font-weight:bold;margin-bottom:4px">Module ${mod.id}: ${mod.title}</div>
      <div style="font-size:11px;color:${mod.color};font-family:monospace">💰 ${mod.income} · ⏱ ${mod.duration}</div>
    </div>
    <div style="padding:16px 18px">
      <div style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:14px;margin-bottom:14px;font-size:12px;color:#aaa;line-height:1.7">${mod.summary}</div>
      <div style="font-size:10px;letter-spacing:3px;color:#444;font-family:monospace;margin-bottom:10px">LESSONS — TAP TO EXPAND</div>
      ${mod.lessons.map((lesson, i) => `
        <div onclick="openLesson(${i})" style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:13px;font-weight:bold">${lesson.title}</div>
          <div style="color:${mod.color};font-size:20px">›</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderLesson(c) {
  const mod = currentSalesModule;
  const lesson = currentLesson;
  c.innerHTML = `
    <div style="background:#0a0a0a;padding:20px 20px 16px;border-bottom:2px solid ${mod.color}">
      <button class="back-btn" onclick="backToModule()">← BACK TO MODULE</button>
      <div style="font-size:18px;font-weight:bold">${lesson.title}</div>
    </div>
    <div style="padding:20px 18px">
      <div style="background:#0f0f0f;border:1px solid #1e1e1e;border-left:3px solid ${mod.color};padding:18px;font-size:13px;color:#ccc;line-height:1.85">${lesson.detail}</div>
      <div style="margin-top:16px;background:#0a0a0a;border:1px solid #1a1a1a;padding:14px;font-family:monospace;font-size:11px;color:#666;line-height:1.7">
        🎙️ <strong style="color:#888">CAR DRILL:</strong> Say this out loud 3 times on your next drive. The reps that own the lines own the doors.
      </div>
    </div>
  `;
}

function openModule(id) {
  currentSalesModule = salesModules.find(m => m.id === id);
  renderSales(document.getElementById('content'));
  document.getElementById('content').scrollTop = 0;
}

function openLesson(i) {
  currentLesson = currentSalesModule.lessons[i];
  renderSales(document.getElementById('content'));
  document.getElementById('content').scrollTop = 0;
}

function backToModules() {
  currentSalesModule = null;
  currentLesson = null;
  renderSales(document.getElementById('content'));
}

function backToModule() {
  currentLesson = null;
  renderSales(document.getElementById('content'));
}

// ── INIT ──────────────────────────────────────────────────────
render();
</script>
</body>
</html>
