function todayKey(){ return new Date().toISOString().split('T')[0]; }
function loadJSON(k,def){ try{ return JSON.parse(localStorage.getItem(k)||'null')||def; }catch(e){ return def; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function getCheckins(){ return loadJSON('ddw_c',{}); }
function getTodayDone(){ return (getCheckins()[todayKey()])||{}; }
function logCheckin(type){
  var c=getCheckins(), t=todayKey();
  if(!c[t]) c[t]={};
  c[t][type]=true;
  saveJSON('ddw_c',c);
  var all=['workout','breakfast','lunch','snack','dinner'].every(function(x){ return c[t][x]; });
  if(all){
    var s=loadJSON('ddw_s',{}), y=new Date(); y.setDate(y.getDate()-1);
    var yk=y.toISOString().split('T')[0];
    s.count=(s.last===yk)?(s.count||0)+1:1; s.last=t;
    saveJSON('ddw_s',s);
  }
  render();
}
function getStreak(){
  var s=loadJSON('ddw_s',{}), t=todayKey(), y=new Date(); y.setDate(y.getDate()-1);
  var yk=y.toISOString().split('T')[0];
  return (s.last===t||s.last===yk)?(s.count||0):0;
}
function getWeek(){
  var c=getCheckins(), wo=0, md=0, fd=0;
  for(var i=0;i<7;i++){
    var d=new Date(); d.setDate(d.getDate()-i);
    var k=d.toISOString().split('T')[0], day=c[k]||{};
    if(day.workout) wo++;
    if(day.breakfast||day.lunch||day.snack||day.dinner) md++;
    if(['workout','breakfast','lunch','snack','dinner'].every(function(t){ return day[t]; })) fd++;
  }
  return {wo:wo,md:md,fd:fd};
}

    "This is the work. Do it."
  ];
  var n=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
  return lines[n%lines.length];
}

// ── NAVIGATION ────────────────────────────────────────────────
function go(page){
  S.page=page; S.salesMod=null; S.salesLesson=null; S.mealSwap=null;
  document.querySelectorAll('.nb').forEach(function(b){ b.classList.remove('on'); });
  var nb=document.getElementById('nb-'+page);
  if(nb) nb.classList.add('on');
  render();
}
function render(){
  var v=document.getElementById('view');
  v.innerHTML=''; v.scrollTop=0;
  if(S.page==='home') renderHome(v);
  else if(S.page==='schedule') renderSchedule(v);
  else if(S.page==='gym') renderGym(v);
  else if(S.page==='meals') renderMeals(v);
  else if(S.page==='sales') renderSales(v);
}

      html+='<div style="font-size:10px;color:#666">'+sw.cost+'</div>';
      html+='</div></div>';
    });
    html+='</div>';
  }

  html+='</div></div>';

  // Costco tip
  html+='<div style="margin-top:10px;background:#0a0a0a;border:1px solid #1a1a1a;border-left:3px solid #00E5A0;padding:11px 13px;font-size:11px;color:#555;line-height:1.7">';
  html+='4 guys = 4x buying power. One person pays at Costco, others Venmo. Rotate weekly. Total per person: <span style="color:#00E5A0">~$85-95/week</span>.';
  html+='</div>';

  // Grocery list
  html+='<div style="margin-top:12px">';
  html+='<div style="font-size:9px;letter-spacing:3px;color:#444;margin-bottom:10px">COSTCO SHOPPING LIST</div>';
  GROCERY.forEach(function(g){
    html+='<div style="background:#0f0f0f;border:1px solid #1a1a1a;padding:12px 13px;margin-bottom:8px">';
    html+='<div style="display:flex;justify-content:space-between;margin-bottom:8px">';
    html+='<div style="font-size:11px;font-weight:bold">'+g.icon+' '+g.cat+'</div>';
    html+='<div style="font-size:10px;color:#00E5A0">'+g.pw+'/person</div>';
    html+='</div>';
    g.items.forEach(function(it){ html+='<div style="background:#0a0a0a;border:1px solid #1a1a1a;padding:5px 9px;font-size:10px;color:#888;margin-bottom:3px">'+it+'</div>'; });
    html+='</div>';
  });
  html+='</div></div></div>';
  v.innerHTML=html;
}

// ── SALES ─────────────────────────────────────────────────────
function renderSales(v){
  if(S.salesLesson!==null && S.salesMod!==null){ renderLesson(v); return; }
  if(S.salesMod!==null){ renderMod(v); return; }

  var html='<div class="pb">';
  html+='<div style="background:#0a0a0a;padding:20px 18px 14px;border-bottom:2px solid #FF6B8A">';
  html+='<div style="font-size:10px;letter-spacing:4px;color:#444;margin-bottom:4px">SETTER FOCUSED · KEEP IT SIMPLE</div>';
  html+='<div style="font-size:22px;font-weight:bold">Sales Training</div>';
  html+='<div style="font-size:11px;color:#555;margin-top:3px">5 modules built for setters in the California summer market</div>';
  html+='</div>';
  html+='<div style="padding:14px 16px">';
  html+='<div style="background:#0f0f0f;border:1px solid #1a1a1a;border-left:3px solid #7C3AED;padding:12px 13px;margin-bottom:14px;font-size:11px;color:#666;line-height:1.7">These modules are built for one thing: more sets, better quality, faster leveling up. Read each one, close the app, and apply it. Simple beats complex every time on the doors.</div>';
  SALES.forEach(function(mod,i){
    html+='<div onclick="S.salesMod='+i+';render()" style="background:#0f0f0f;border:1px solid #1a1a1a;border-left:3px solid '+mod.color+';padding:13px;margin-bottom:9px;cursor:pointer">';
    html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">';
    html+='<div>';
    html+='<div style="display:inline-block;background:'+mod.color+';color:#000;font-size:8px;font-weight:bold;letter-spacing:2px;padding:2px 7px;margin-bottom:5px">'+mod.tag+'</div>';
    html+='<div style="font-size:14px;font-weight:bold">Module '+mod.id+': '+mod.title+'</div>';
    html+='</div>';
    html+='<div style="color:'+mod.color+';font-size:18px">›</div>';
    html+='</div>';
    html+='<div style="font-size:11px;color:#666;margin-bottom:7px;line-height:1.6">'+mod.summary+'</div>';
    html+='<div style="font-size:10px;color:#444">⏱ '+mod.time+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  v.innerHTML=html;
}

function renderMod(v){
  var mod=SALES[S.salesMod];
  var html='<div class="pb">';
  html+='<div style="background:#0a0a0a;padding:20px 18px 14px;border-bottom:2px solid '+mod.color+'">';
  html+='<button onclick="S.salesMod=null;render()" style="background:none;border:none;color:#7C3AED;font-family:\'Courier New\',monospace;font-size:11px;cursor:pointer;padding:0;margin-bottom:10px;display:block">← ALL MODULES</button>';
  html+='<div style="display:inline-block;background:'+mod.color+';color:#000;font-size:8px;font-weight:bold;letter-spacing:2px;padding:2px 7px;margin-bottom:6px">'+mod.tag+'</div>';
  html+='<div style="font-size:20px;font-weight:bold;margin-bottom:4px">Module '+mod.id+': '+mod.title+'</div>';
  html+='<div style="font-size:10px;color:#555">⏱ '+mod.time+'</div>';
  html+='</div>';
  html+='<div style="padding:14px 16px">';
  html+='<div style="background:#0f0f0f;border:1px solid #1a1a1a;border-left:3px solid '+mod.color+';padding:13px;margin-bottom:8px;font-size:12px;color:#aaa;line-height:1.7">'+mod.summary+'</div>';
  html+='<div style="background:#080808;border:1px solid #141414;padding:12px 13px;margin-bottom:14px;font-size:11px;color:#666;line-height:1.7"><span style="color:#444">Why it matters: </span>'+mod.why+'</div>';
  html+='<div style="font-size:9px;letter-spacing:3px;color:#444;margin-bottom:10px">SECTIONS — TAP TO EXPAND</div>';
  mod.sections.forEach(function(sec,i){
    html+='<div onclick="S.salesLesson='+i+';render()" style="background:#0f0f0f;border:1px solid #1a1a1a;border-left:3px solid '+mod.color+';padding:13px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">';
    html+='<div style="font-size:13px;font-weight:bold">'+sec.title+'</div>';
    html+='<div style="color:'+mod.color+';font-size:18px">›</div>';
    html+='</div>';
  });
  html+='</div></div>';
  v.innerHTML=html;
}

function renderLesson(v){
  var mod=SALES[S.salesMod];
  var sec=mod.sections[S.salesLesson];
  var html='<div class="pb">';
  html+='<div style="background:#0a0a0a;padding:20px 18px 14px;border-bottom:2px solid '+mod.color+'">';
  html+='<button onclick="S.salesLesson=null;render()" style="background:none;border:none;color:#7C3AED;font-family:\'Courier New\',monospace;font-size:11px;cursor:pointer;padding:0;margin-bottom:10px;display:block">← '+mod.title+'</button>';
  html+='<div style="font-size:18px;font-weight:bold">'+sec.title+'</div>';
  html+='</div>';
  html+='<div style="padding:14px 16px">';
  html+='<div style="background:#0f0f0f;border:1px solid #1a1a1a;border-left:3px solid '+mod.color+';padding:16px;font-size:13px;color:#ccc;line-height:1.85">'+sec.content.replace(/\n/g,'<br><br>')+'</div>';
  html+='<div style="margin-top:14px;background:#080808;border:1px solid #141414;padding:12px 13px;font-size:10px;color:#555;line-height:1.7">Read this, close the app, and apply it on the doors. Simple execution beats perfect knowledge every time.</div>';
  html+='</div></div>';
  v.innerHTML=html;
}

window.addEventListener('load', function(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

      var b=document.createElement('div');

      b.innerHTML='📲 <strong style="color:#e8e8e8">Install DDW:</strong> Tap Share then "Add to Home Screen" <button onclick="this.parentNode.remove()" style="float:right;background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:0">✕</button>';
      document.body.appendChild(b);
      setTimeout(function(){ if(b.parentNode) b.remove(); },8000);
    },2000);
  }
});

render();
